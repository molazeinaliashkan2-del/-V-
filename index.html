<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bay Max</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,sans-serif}
html{height:100%}
body{background:#0b1a2b;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;padding:clamp(6px,2vw,16px);overflow-x:hidden}
.scene{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(8px,3vw,25px);align-items:center;width:100%;max-width:600px}
.col{display:flex;flex-direction:column;gap:clamp(10px,3vw,22px);align-items:center}
.btn{width:clamp(66px,17vw,100px);height:clamp(60px,15.5vw,90px);border-radius:16px;background:rgba(127,215,255,.15);border:2px solid #7fd7ff;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:clamp(17px,4.6vw,24px);font-family:inherit;transition:.2s}
.btn:hover,.btn:active{background:#7fd7ff;color:#001;transform:scale(1.08)}
.btn small{font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:15px;z-index:999}
.modal.hidden{display:none}
.box{background:#0e2233;border:2px solid #7fd7ff;border-radius:20px;width:100%;max-width:430px;padding:20px;max-height:92vh;overflow-y:auto}
.box h3{color:#7fd7ff;margin-bottom:15px;text-align:center;font-size:16px}
.close-x{float:left;background:none;border:none;color:#7fd7ff;font-size:22px;cursor:pointer}
.chat-area{background:#061520;border-radius:12px;padding:12px;height:240px;overflow-y:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 12px;border-radius:12px;max-width:85%;font-size:13px;line-height:1.5}
.msg.user{background:#7fd7ff;color:#001;align-self:flex-end}.msg.bot{background:#1c3a52;color:#dff;align-self:flex-start}
.input-row{display:flex;gap:8px}.input-row input{flex:1;padding:10px;border-radius:10px;border:1px solid #7fd7ff;background:#061520;color:#fff;outline:none;font-family:inherit;font-size:14px}
.input-row button,.add-row button{padding:10px 16px;background:#7fd7ff;border:none;border-radius:10px;color:#001;font-weight:bold;cursor:pointer;font-family:inherit}
.form-row{margin-bottom:12px}.form-row label{display:block;margin-bottom:5px;color:#9fd;font-size:13px}
.form-row input,.form-row select{width:100%;padding:10px;border-radius:10px;border:1px solid #7fd7ff;background:#061520;color:#fff;outline:none;font-family:inherit;font-size:14px}
.save-btn{width:100%;padding:12px;background:#7fd7ff;color:#001;border:none;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer;font-family:inherit;margin-bottom:6px}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.cal-nav button{background:rgba(127,215,255,.15);border:1px solid #7fd7ff;color:#7fd7ff;width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer;font-weight:bold}
.cal-nav .title{color:#7fd7ff;font-weight:bold;font-size:15px}.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}.weekdays div{text-align:center;font-size:11px;color:#9fd}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{aspect-ratio:1;background:#061520;border:1px solid #1c3a52;border-radius:8px;color:#dff;font-size:13px;cursor:pointer;font-family:inherit;position:relative}.day:hover{border-color:#7fd7ff}.day.empty{background:transparent;border:none;cursor:default}.day.today{border:2px solid #7fd7ff;font-weight:bold}.day.has-tasks:after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;background:#ffd97f;border-radius:50%}
.back-btn{background:rgba(127,215,255,.15);border:1px solid #7fd7ff;color:#7fd7ff;padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer;margin-bottom:10px;font-family:inherit}
.letter{background:#061520;border:1px dashed #7fd7ff;border-radius:12px;padding:14px}.letter-title{color:#7fd7ff;font-weight:bold;text-align:center;margin-bottom:12px;font-size:14px}
.task{display:flex;align-items:center;gap:8px;background:#0e2233;padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:13px;border:1px solid #1c3a52}.task.done{opacity:.5;text-decoration:line-through}.task input[type=checkbox]{width:18px;height:18px;accent-color:#7fd7ff;cursor:pointer}.task span{flex:1;word-break:break-word}.task .del{background:none;border:none;color:#ff7f7f;font-size:16px;cursor:pointer;padding:0 4px}.empty-day{text-align:center;color:#789;font-size:12px;padding:14px 0}
.add-row{display:flex;gap:6px;margin-top:10px}.add-row input{flex:1;padding:9px;border-radius:8px;border:1px solid #7fd7ff;background:#0e2233;color:#fff;outline:none;font-family:inherit;font-size:13px}
.hidden{display:none}#chessBoard{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:#1c3a52;padding:6px;border-radius:10px;max-width:380px;margin:0 auto}
.chess-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,7vw,40px);cursor:pointer;user-select:none;border-radius:3px}.chess-cell.light{background:#d8e7ed;color:#111}.chess-cell.dark{background:#638497;color:#111}.chess-cell.selected{outline:3px solid #7fd7ff;outline-offset:-3px}.chess-cell.move{box-shadow:inset 0 0 0 4px rgba(127,215,255,.55)}
.mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.mood-btn{background:#061520;border:1px solid #1c3a52;border-radius:12px;padding:14px 6px;color:#fff;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:26px;transition:.2s}.mood-btn:hover{border-color:#7fd7ff;background:rgba(127,215,255,.15)}.mood-btn.active{border:2px solid #7fd7ff;background:rgba(127,215,255,.25)}.mood-btn small{font-size:11px;color:#9fd}
.symptom-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:15px}.symptom-item{display:flex;align-items:center;gap:6px;background:#061520;padding:8px 10px;border-radius:8px;font-size:12px;border:1px solid #1c3a52;cursor:pointer}.symptom-item input{accent-color:#7fd7ff;width:16px;height:16px;cursor:pointer}
.result-box{background:#061520;border:1px dashed #7fd7ff;border-radius:12px;padding:14px;font-size:13px;line-height:1.8;color:#dff;margin-top:10px}.result-box strong{color:#ffd97f}
@media(max-width:480px){.box{padding:14px}}
@media(max-height:680px){.stage3d{height:clamp(170px,34vh,230px)}.baymax3d{width:clamp(110px,21vh,150px);height:clamp(157px,30vh,214px)}}

/* ===== بی‌مکس سه‌بعدی ===== */
.stage3d{height:clamp(230px,46vw,340px);position:relative;display:flex;align-items:flex-end;justify-content:center}
.shadow{
  position:absolute;bottom:6px;width:clamp(100px,24vw,150px);height:clamp(13px,3.2vw,20px);border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.6) 0%,rgba(0,0,0,.22) 45%,transparent 75%);
  filter:blur(6px);animation:shadowPulse 3.8s ease-in-out infinite;z-index:1
}
.baymax3d{position:relative;z-index:2;width:clamp(140px,28vw,210px);height:clamp(200px,40vw,300px);animation:float3d 3.8s ease-in-out infinite;transform-origin:center bottom}
.baymax3d svg{width:100%;height:100%;display:block;overflow:visible}
.hit{cursor:pointer;transition:filter .2s}
.hit:hover{filter:brightness(1.08) drop-shadow(0 0 8px rgba(120,200,255,.6))}
#head{transform-origin:175px 100px;animation:headBob 3.8s ease-in-out infinite}
#body{transform-origin:175px 280px}
#armL{transform-origin:120px 135px;animation:armL 3.8s ease-in-out infinite}
#armR{transform-origin:230px 135px;animation:armR 3.8s ease-in-out infinite}
#wristR{transform-origin:268px 350px}
#lidWinL,#lidWinR{animation:blink 5s infinite}
.handshake #armR{animation:handshakeAnim 1.5s ease-in-out !important}
.handshake #head{animation:headTiltR 1.5s ease-in-out !important}
.jump{animation:jumpAnim .9s ease-in-out !important}
.scratch #armL{animation:scratchAnim 2.6s ease-in-out !important}
.scratch #body{animation:bellyWiggle 2.6s ease-in-out !important}
.scratch #head{animation:headScratchWiggle 2.6s ease-in-out !important}
.candy #armR{animation:candyAnim 1.9s ease-in-out !important}
.candy #head{animation:headTiltR 1.9s ease-in-out !important}
.candy .candy-g{animation:candyPop 1.9s ease-in-out !important}
.candy #fingersR{animation:fingersGrip 1.9s ease-in-out !important}
.candy #wristR{animation:wristCorrectAnim 1.9s ease-in-out !important}
.candy-g{opacity:0;transform-origin:268px 305px}
.heartbeat #body{animation:heartbeat 1.2s ease-in-out 2}
.look #head{animation:headLookAnim 4s ease-in-out !important}

@keyframes float3d{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shadowPulse{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.7);opacity:.5}}
@keyframes headBob{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-3px)}}
@keyframes armL{0%,100%{transform:rotate(2deg)}50%{transform:rotate(6deg)}}
@keyframes armR{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(-6deg)}}
@keyframes blink{
  0%, 42%, 48%, 100% { transform: translateY(0); }
  44%, 46%           { transform: translateY(30px); }
}
@keyframes handshakeAnim{
  0%{transform:rotate(-2deg)}
  20%{transform:rotate(-30deg) translate(-10px,-12px)}
  35%{transform:rotate(-26deg) translate(-10px,-12px)}
  50%{transform:rotate(-32deg) translate(-10px,-12px)}
  65%{transform:rotate(-26deg) translate(-10px,-12px)}
  80%{transform:rotate(-30deg) translate(-10px,-12px)}
  100%{transform:rotate(-2deg)}
}
@keyframes headTiltR{
  0%{transform:rotate(-2deg) translateY(0)}
  30%{transform:rotate(9deg) translateY(-1px)}
  70%{transform:rotate(9deg) translateY(-1px)}
  100%{transform:rotate(-2deg) translateY(0)}
}
@keyframes jumpAnim{
  0%,100%{transform:translateY(0)}
  35%{transform:translateY(-45px)}
  55%{transform:translateY(-31px)}
  75%{transform:translateY(-6px)}
}
@keyframes scratchAnim{
  0%   { transform: rotate(2deg); }
  10%  { transform: rotate(-34deg); }
  22%  { transform: rotate(-44deg); }
  34%  { transform: rotate(-33deg); }
  46%  { transform: rotate(-44deg); }
  58%  { transform: rotate(-33deg); }
  70%  { transform: rotate(-44deg); }
  85%  { transform: rotate(-30deg); }
  100% { transform: rotate(2deg); }
}
@keyframes bellyWiggle{
  0%,100%{transform:scale(1,1) rotate(0)}
  20%{transform:scale(1.03,1.02) rotate(1.5deg)}
  40%{transform:scale(1.01,1.02) rotate(-1.5deg)}
  60%{transform:scale(1.03,1.02) rotate(1.5deg)}
  80%{transform:scale(1.01,1.02) rotate(-1deg)}
}
@keyframes headScratchWiggle{
  0%,100%{transform:rotate(0) translateY(0)}
  25%{transform:rotate(3deg) translateY(1px)}
  50%{transform:rotate(-3deg) translateY(-1px)}
  75%{transform:rotate(2deg) translateY(0)}
}
@keyframes candyAnim{
  0%{transform:rotate(-2deg)}
  22%{transform:translate(28px,-8px) rotate(58deg)}
  38%{transform:translate(30px,-10px) rotate(62deg)}
  55%{transform:translate(29px,-9px) rotate(59deg)}
  80%{transform:translate(28px,-8px) rotate(58deg)}
  100%{transform:rotate(-2deg)}
}
@keyframes wristCorrectAnim{
  0%{transform:rotate(0deg)}
  22%{transform:rotate(-34deg)}
  38%{transform:rotate(-38deg)}
  55%{transform:rotate(-35deg)}
  80%{transform:rotate(-34deg)}
  100%{transform:rotate(0deg)}
}
@keyframes candyPop{
  0%{opacity:0;transform:scale(0) rotate(-40deg)}
  20%{opacity:1;transform:scale(1.15) rotate(8deg)}
  40%{opacity:1;transform:scale(1) rotate(0)}
  80%{opacity:1;transform:scale(1) rotate(0)}
  100%{opacity:0;transform:scale(0) rotate(40deg)}
}
@keyframes fingersGrip{
  0%{transform:translateY(0)}
  30%{transform:translateY(-6px)}
  50%{transform:translateY(-4px)}
  85%{transform:translateY(-4px)}
  100%{transform:translateY(0)}
}
@keyframes heartbeat{
  0%,100%{transform:scale(1,1)}
  30%{transform:scale(1.05,1.07)}
  60%{transform:scale(.99,.98)}
}
@keyframes headLookAnim{
  0%   { transform: rotate(-2deg) translateY(0); }
  14%  { transform: rotate(17deg) translateY(-2px); }
  30%  { transform: rotate(15deg) translateY(-2px); }
  46%  { transform: rotate(17deg) translateY(-2px); }
  60%  { transform: rotate(-15deg) translateY(-2px); }
  76%  { transform: rotate(-17deg) translateY(-2px); }
  90%  { transform: rotate(3deg) translateY(0); }
  100% { transform: rotate(-2deg) translateY(0); }
}
@media(prefers-reduced-motion:reduce){
  .baymax3d,#head,#body,#armL,#armR,#lidWinL,#lidWinR,.shadow,.look #head{animation:none!important}
}
@supports(height:100dvh){body{min-height:100dvh}}
.chat-area{height:min(46vh,340px)}
.msg{white-space:pre-wrap;word-break:break-word}
#micBtn{padding:10px 12px}
#micBtn.on{background:#ff7f7f!important;animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(1.1)}}
.chat-tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chat-tools button{flex:1;min-width:92px;padding:8px;background:rgba(127,215,255,.15);border:1px solid #7fd7ff;color:#7fd7ff;border-radius:10px;font-size:12px;cursor:pointer;font-family:inherit}
.gm{display:flex;gap:6px;margin-top:6px}
.gm button{padding:7px 12px;border-radius:999px;border:0;background:#fff;color:#001;font-family:inherit;font-size:12px;cursor:pointer}
#narmoOv{position:fixed;inset:0;z-index:998;background:#eef7f6;display:flex;flex-direction:column}
#narmoOv.hidden{display:none}
#narmoBack{flex:none;background:#fff;border:0;border-bottom:1px solid #cfe3e0;color:#17333a;font-family:inherit;font-size:14px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;text-align:start;cursor:pointer}
#narmoFrame{flex:1;border:0;width:100%}
.ghost{width:100%;padding:12px;background:transparent;color:#7fd7ff;border:1px solid #7fd7ff;border-radius:10px;font-weight:bold;font-size:14px;cursor:pointer;font-family:inherit;margin-bottom:6px}
.gmenu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gbtn{background:rgba(127,215,255,.12);border:2px solid #7fd7ff;border-radius:16px;color:#fff;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;cursor:pointer;font-size:13px}
.gbtn span{font-size:30px}.gbtn b{font-size:13px;text-align:center}.gbtn small{color:#9fd;font-size:11px}
.gbtn.off{opacity:.5;border-style:dashed}
.gmsg{margin-top:12px;text-align:center;color:#ffd97f;font-size:13px;min-height:18px}
.fbscore{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:8px;color:#dff}
.fbscore b{color:#7fd7ff;font-size:18px}
.fbmsg{text-align:center;color:#9fd;font-size:13px;margin-top:8px;min-height:18px}
#fbOv{position:fixed;inset:0;z-index:997;background:#bfe6e3}
#fbOv.hidden{display:none}
#fbFrame{border:0;width:100%;height:100%;display:block}
#fbX{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:999;border:0;border-radius:999px;background:rgba(29,59,58,.85);color:#fff;font-size:15px;padding:8px 14px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div class="scene">
<div class="col">
<button class="btn" id="btnChat"><span>💬</span><small>چت متنی</small></button>
<button class="btn" id="btnVoice"><span>🎤</span><small>چت صوتی</small></button>
<button class="btn" id="btnSettings"><span>⚙️</span><small>تنظیمات</small></button>
</div>

<div class="stage3d">
  <div class="shadow"></div>
  <div class="baymax3d" id="baymax3d">
    <svg viewBox="0 0 350 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="gHead" cx="36%" cy="26%" r="78%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="38%" stop-color="#fbfdfe"/>
          <stop offset="72%" stop-color="#e2e9ee"/>
          <stop offset="100%" stop-color="#aab6bf"/>
        </radialGradient>
        <radialGradient id="gBody" cx="36%" cy="20%" r="82%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="30%" stop-color="#fbfdfe"/>
          <stop offset="65%" stop-color="#e5ebef"/>
          <stop offset="92%" stop-color="#c4cfd7"/>
          <stop offset="100%" stop-color="#a7b3bc"/>
        </radialGradient>
        <radialGradient id="gBelly" cx="40%" cy="22%" r="72%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.65)"/>
          <stop offset="55%" stop-color="rgba(255,255,255,0.18)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </radialGradient>
        <linearGradient id="gArm" x1="0" y1="0" x2="0.7" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="40%" stop-color="#f7fafc"/>
          <stop offset="100%" stop-color="#c6d0d8"/>
        </linearGradient>
        <linearGradient id="gFinger" x1="0" y1="0" x2="0.4" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="55%" stop-color="#f5f9fb"/>
          <stop offset="100%" stop-color="#bcc7cf"/>
        </linearGradient>
        <linearGradient id="gLeg" x1="0" y1="0" x2="0.4" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="45%" stop-color="#f6f9fb"/>
          <stop offset="100%" stop-color="#c3cdd5"/>
        </linearGradient>
        <radialGradient id="gCandy" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#ff9ec7"/>
          <stop offset="45%" stop-color="#ff5fa2"/>
          <stop offset="100%" stop-color="#c92e6b"/>
        </radialGradient>
        <clipPath id="clipEyeL">
          <ellipse id="lidWinL" cx="148" cy="40" rx="9" ry="9"/>
        </clipPath>
        <clipPath id="clipEyeR">
          <ellipse id="lidWinR" cx="202" cy="40" rx="9" ry="9"/>
        </clipPath>
      </defs>

      <g id="legL" class="hit" data-act="jump">
        <path d="M 112 375 Q 96 375 92 400 L 88 448 Q 88 482 130 482 Q 172 482 172 448 L 168 400 Q 164 375 148 375 Z"
              fill="url(#gLeg)" stroke="#b3bfc8" stroke-width="0.8"/>
        <ellipse cx="128" cy="422" rx="16" ry="28" fill="rgba(255,255,255,0.78)" filter="blur(5px)"/>
      </g>
      <g id="legR" class="hit" data-act="jump">
        <path d="M 202 375 Q 186 375 182 400 L 178 448 Q 178 482 220 482 Q 262 482 262 448 L 258 400 Q 254 375 238 375 Z"
              fill="url(#gLeg)" stroke="#b3bfc8" stroke-width="0.8"/>
        <ellipse cx="222" cy="422" rx="16" ry="28" fill="rgba(255,255,255,0.78)" filter="blur(5px)"/>
      </g>

      <g id="body">
        <path class="hit" data-act="scratch"
              d="M 175 98 C 122 98 92 148 86 200 C 78 270 68 330 80 375 C 92 425 128 452 175 452 C 222 452 258 425 270 375 C 282 330 272 270 264 200 C 258 148 228 98 175 98 Z"
              fill="url(#gBody)" stroke="#b3bfc8" stroke-width="0.8"/>
        <ellipse class="hit" data-act="scratch" cx="175" cy="330" rx="82" ry="100" fill="url(#gBelly)"/>
        <ellipse cx="140" cy="250" rx="30" ry="42" fill="rgba(255,255,255,0.92)" filter="blur(11px)"/>
        <ellipse cx="205" cy="165" rx="11" ry="9" fill="rgba(255,255,255,0.7)" filter="blur(4px)"/>
        <ellipse cx="175" cy="155" rx="26" ry="9" fill="none" stroke="rgba(180,195,205,0.55)" stroke-width="1.3"/>
        <ellipse cx="175" cy="108" rx="36" ry="12" fill="rgba(12,22,38,0.28)" filter="blur(7px)"/>
        <path d="M 96 165 Q 82 250 88 340" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="3" stroke-linecap="round" filter="blur(2px)"/>
        <g id="chestScreen">
          <rect x="110" y="182" width="130" height="100" rx="18" fill="#0b1620" stroke="#2a3a4a" stroke-width="3"/>
          <rect x="118" y="190" width="114" height="84" rx="11" fill="#050c14" id="screenBg"/>
          <g id="screenContent" transform="translate(175,232)"></g>
        </g>
      </g>

      <g id="armL" class="hit" data-act="scratch">
        <path d="M 100 128 Q 74 142 68 198 L 56 288 Q 50 340 68 366 Q 86 382 102 366 Q 112 350 106 318 L 114 212 Q 118 152 120 128 Z"
              fill="url(#gArm)" stroke="#b9c4cd" stroke-width="0.8"/>
        <ellipse cx="86" cy="198" rx="8" ry="44" fill="rgba(255,255,255,0.8)" filter="blur(5px)"/>
        <ellipse cx="72" cy="368" rx="6" ry="8" fill="url(#gFinger)" stroke="#b9c4cd" stroke-width="0.6"/>
        <ellipse cx="84" cy="372" rx="6" ry="8" fill="url(#gFinger)" stroke="#b9c4cd" stroke-width="0.6"/>
        <ellipse cx="96" cy="370" rx="6" ry="8" fill="url(#gFinger)" stroke="#b9c4cd" stroke-width="0.6"/>
      </g>

<script>
var settings={botName:'Bay Max',userName:'دوست من',botColor:'#7fd7ff'};
try{var s=localStorage.getItem('baymax_set');if(s)settings=Object.assign(settings,JSON.parse(s))}catch(e){}
function show(id){document.getElementById(id).classList.remove('hidden')}
function hide(id){document.getElementById(id).classList.add('hidden')}
function applyColor(){document.documentElement.style.setProperty('--bot-color',settings.botColor);document.querySelectorAll('.btn,.box').forEach(function(x){x.style.borderColor=settings.botColor});document.querySelectorAll('.save-btn,.input-row button,.add-row button').forEach(function(x){x.style.background=settings.botColor})}

var DEFAULT_WORKER='https://old-butterfly-ec55.molazeinaliashkan2.workers.dev';
function $(id){return document.getElementById(id)}
function lsGet(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var chat=lsGet('bm_chat',[]),mem=lsGet('bm_mem',[]),turns=0,voiceMode=false,speakOn=lsGet('bm_speak',false);
var rec=null,speakId=0,ttsAudio=null,voices=[],busy=false;
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function saveChat(){if(chat.length>60)chat=chat.slice(-60);lsSet('bm_chat',chat)}
var DM={proxy:'-',gemini:'gemini-3.1-flash-lite',groq:'openai/gpt-oss-120b',openrouter:'nvidia/nemotron-3-ultra-550b-a55b:free',openai:'gpt-4o-mini',anthropic:'claude-haiku-5-5'};
var URLS={openai:'https://api.openai.com/v1/chat/completions',groq:'https://api.groq.com/openai/v1/chat/completions',openrouter:'https://openrouter.ai/api/v1/chat/completions'};
function cfg(){return lsGet('narmo_cfg',null)||{prov:'proxy',model:'-',key:DEFAULT_WORKER}}
function workerUrl(){var c=cfg();return c.prov==='proxy'&&c.key?c.key:DEFAULT_WORKER}
function syncAI(){var p=$('inProv').value;$('inKey').type=p==='proxy'?'text':'password';$('inKey').placeholder=p==='proxy'?'https://....workers.dev':'API key';$('keyLbl').textContent=p==='proxy'?'آدرس سرور واسط':'کلید API';$('mdlRow').style.display=p==='proxy'?'none':''}
function fillAI(){var c=cfg();$('inProv').value=c.prov;$('inKey').value=c.key||'';$('inModel').value=c.prov==='proxy'?'':(c.model||DM[c.prov]);$('aiTest').textContent='';syncAI()}
$('inProv').onchange=function(){$('inModel').value=this.value==='proxy'?'':DM[this.value];$('inKey').value='';syncAI()};
function saveAI(){
  var p=$('inProv').value,k=$('inKey').value.trim(),m=$('inModel').value.trim()||DM[p];
  if(p==='proxy')k=k.replace(/\/+$/,'');
  try{if(k)localStorage.setItem('narmo_cfg',JSON.stringify({prov:p,model:m,key:k}));else localStorage.removeItem('narmo_cfg')}catch(e){}
}
$('testAIBtn').onclick=async function(){
  var o=$('aiTest'),p=$('inProv').value,k=$('inKey').value.trim().replace(/\/+$/,'');o.textContent='...';
  try{
    if(p==='proxy'){var r=await fetch(k||DEFAULT_WORKER);var t=await r.text();o.textContent=/running/i.test(t)?'✅ سرور واسط درسته.':'⚠️ سرور جواب داد ولی چیزی که انتظار داشتم نبود.'}
    else{var T={gemini:'https://generativelanguage.googleapis.com/',groq:'https://api.groq.com/',openrouter:'https://openrouter.ai/',openai:'https://api.openai.com/',anthropic:'https://api.anthropic.com/'};await fetch(T[p],{mode:'no-cors'});o.textContent=k?'✅ سرور '+p+' در دسترسه. برای تست کلید یه پیام توی چت بفرست.':'✅ سرور در دسترسه. کلید رو وارد کن.'}
  }catch(e){o.textContent='❌ وصل نشد (فیلترشکن یا آدرس رو چک کن).'}
};

/* ---- بازی‌ساز ---- */
function codeOf(t){
  var m=t.match(/```(?:html)?\s*([\s\S]*?)```/i);
  if(m&&/<(html|!doctype|body|script|canvas)/i.test(m[1]))return m[1].trim();
  var r=t.match(/<!doctype html[\s\S]*<\/html>/i)||t.match(/<html[\s\S]*<\/html>/i);
  return r?r[0]:null;
}
function prose(t){return t.replace(/```[\s\S]*?```/g,'').replace(/```[\s\S]*$/,'').replace(/<!doctype html[\s\S]*<\/html>/i,'').trim()}
function spoken(t){return codeOf(t)?(prose(t)||'بازی آماده‌ست!'):t}
function playGame(c){$('gframe').srcdoc=c;show('gameRun')}
function closeGame(){$('gframe').srcdoc='';hide('gameRun')}
function downloadGame(c){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/html'}));a.download='game.html';document.body.appendChild(a);a.click();a.remove()}

/* ---- پیام‌ها ---- */
function renderMsg(who,text){
  var area=$('chatArea'),d=document.createElement('div');d.className='msg '+who;
  var code=who==='bot'?codeOf(text):null;
  d.textContent=code?(prose(text)||'بازی آماده‌ست!'):text;
  if(code){
    var g=document.createElement('div');g.className='gm';
    var p=document.createElement('button');p.textContent='▶ بازی کن';p.onclick=function(){playGame(code)};
    var dl=document.createElement('button');dl.textContent='⬇ دانلود';dl.onclick=function(){downloadGame(code)};
    g.appendChild(p);g.appendChild(dl);d.appendChild(g);
  }
  area.appendChild(d);area.scrollTop=area.scrollHeight;return d;
}
function addMsg(who,text,keep){
  var d=renderMsg(who,text);
  if(keep!==false&&(who==='user'||who==='bot')){chat.push({r:who,t:text});saveChat()}
  return d;
}

/* ---- صدا: خروجی (فارسی گوشی، بعد اینترنت) ---- */
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){}}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function faVoice(){
  return voices.find(function(v){return /^fa/i.test(v.lang.replace('_','-'))})||voices.find(function(v){return /persian|farsi|فارسی/i.test(v.name)});
}
function stopSpeak(){speakId++;try{speechSynthesis.cancel()}catch(e){}if(ttsAudio){try{ttsAudio.pause()}catch(e){}ttsAudio=null}}
function chunks(t){
  var parts=t.match(/[^.!؟?،,]+[.!؟?،,]?/g)||[t],out=[],cur='';
  parts.forEach(function(p){if((cur+p).length>170&&cur){out.push(cur);cur=p}else cur+=p});
  if(cur.trim())out.push(cur);return out;
}
function speak(t,done){
  var id=++speakId,fin=false;
  function end(){if(fin||id!==speakId)return;fin=true;if(done)done()}
  var v=faVoice();
  if(v){
    try{var u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang=v.lang;u.rate=.95;u.onend=u.onerror=end;speechSynthesis.cancel();speechSynthesis.speak(u);return}catch(e){}
  }
  var ch=chunks(t),i=0;
  function online(){
    if(id!==speakId)return;
    if(i>=ch.length){end();return}
    var q=encodeURIComponent(ch[i++]),e=0,EP=[
      'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=fa&q=',
      'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=fa&q='];
    function tryEp(){
      if(id!==speakId)return;
      if(e>=EP.length){end();return}
      var a=new Audio(EP[e++]+q),bad=false;
      function f(){if(bad)return;bad=true;tryEp()}
      ttsAudio=a;a.onended=online;a.onerror=f;a.play().catch(f);
    }
    tryEp();
  }
  var started=false,went=false;
  function go(){if(went||id!==speakId)return;went=true;try{speechSynthesis.cancel()}catch(e){}online()}
  try{
    var n=new SpeechSynthesisUtterance(t);n.lang='fa-IR';n.rate=.95;
    n.onstart=function(){started=true};n.onend=function(){if(started)end()};n.onerror=go;
    speechSynthesis.cancel();speechSynthesis.speak(n);
    setTimeout(function(){if(!started)go()},1500);
  }catch(e){go()}
}

/* ---- صدا: ورودی (میکروفون) ---- */
function listen(){
  if(!SR){voiceMode=false;addMsg('bot','مرورگرت تشخیص صدا رو پشتیبانی نمی‌کنه. از Chrome استفاده کن یا تایپ کن.',false);return}
  if(rec){rec.stop();return}
  stopSpeak();var got=false;
  rec=new SR();rec.lang='fa-IR';rec.interimResults=false;
  rec.onstart=function(){$('micBtn').classList.add('on')};
  rec.onresult=function(e){got=true;sendText(e.results[0][0].transcript)};
  rec.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed'){voiceMode=false;addMsg('bot','اجازه‌ی میکروفون داده نشده. می‌تونی تایپ کنی.',false)}};
  rec.onend=function(){
    $('micBtn').classList.remove('on');rec=null;
    if(voiceMode&&!got&&!$('chatModal').classList.contains('hidden'))setTimeout(function(){if(voiceMode&&!rec&&!busy)listen()},600);
  };
  try{rec.start()}catch(e){rec=null}
}

/* ---- حافظه ---- */
function addMem(x){x=String(x).trim().slice(0,160);if(x&&mem.indexOf(x)<0){mem.push(x);if(mem.length>40)mem.shift();lsSet('bm_mem',mem)}}
async function extractMem(){
  if(cfg().prov!=='proxy')return;
  try{
    var msgs=chat.slice(-8).map(function(m){return{role:m.r==='user'?'user':'assistant',content:m.t}});
    var r=await fetch(workerUrl(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:'extract',memory:mem,messages:msgs})});
    var j=await r.json(),t=j.choices[0].message.content||'';
    JSON.parse((t.match(/\[[\s\S]*\]/)||['[]'])[0]).filter(function(x){return typeof x==='string'}).slice(0,3).forEach(addMem);
  }catch(e){}
}

/* ---- گفت‌وگو با هوش مصنوعی (از طریق سرور واسط) ---- */
async function ask(){
  var c=cfg(),msgs=chat.slice(-12).map(function(m){return{role:m.r==='user'?'user':'assistant',content:m.t}});
  var persona=['اسم تو «'+settings.botName+'» است؛ خودت را با همین اسم معرفی کن.','اسم کاربر: '+settings.userName].concat(mem.slice(-36));
  var out='',r,j;
  if(c.prov==='proxy'){
    r=await fetch(c.key||DEFAULT_WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,memory:persona})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    j=await r.json();out=(j.choices&&j.choices[0]&&j.choices[0].message.content)||'';
  }else{
    var sys='تو «'+settings.botName+'» هستی، یه دوست مهربون، آروم و دلسوز و یه دستیار کمک‌کننده. درباره‌ی هر موضوعی درست و مفید جواب بده. وقتی کسی می‌خواد درد دل کنه، اول گوش بده. جواب‌ها به‌صورت پیش‌فرض کوتاه و گفتاری باشن (دو تا پنج جمله). فقط گفت‌وگو می‌کنی. فقط وقتی نشونه‌ی واقعا جدی بود به پزشک اشاره کن. فارسی محاوره‌ای، بدون ایموجی و مارک‌داون. اگه کاربر خواست بازی یا برنامه‌ی کوچیک بسازی، یه جمله بگو و بعد کد کامل HTML تک‌فایلی رو داخل ```html بذار.\nچیزهایی که یادته:\n- '+persona.join('\n- ');
    if(c.prov==='gemini'){
      var cs=[];msgs.forEach(function(m){var role=m.role==='user'?'user':'model';if(cs.length&&cs[cs.length-1].role===role)cs[cs.length-1].parts[0].text+='\n'+m.content;else cs.push({role:role,parts:[{text:m.content}]})});
      r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(c.model||DM.gemini)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':c.key},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:cs,generationConfig:{maxOutputTokens:4000}})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      j=await r.json();out=((j.candidates&&j.candidates[0]&&j.candidates[0].content.parts)||[]).map(function(p){return p.text||''}).join('');
    }else if(c.prov==='anthropic'){
      r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:c.model||DM.anthropic,max_tokens:3000,system:sys,messages:msgs})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      j=await r.json();out=(j.content&&j.content[0]&&j.content[0].text)||'';
    }else{
      r=await fetch(URLS[c.prov],{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+c.key},body:JSON.stringify({model:c.model||DM[c.prov],max_tokens:3000,messages:[{role:'system',content:sys}].concat(msgs)})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      j=await r.json();out=(j.choices&&j.choices[0]&&j.choices[0].message.content)||'';
    }
  }
  out=out.replace(/<think>[\s\S]*?<\/think>/g,'').trim();
  if(!/```|<!doctype|<html/i.test(out))out=out.replace(/[*#`]/g,'').trim();
  if(!out)throw new Error('جواب خالی');
  return out;
}
function afterBot(){if(voiceMode&&!$('chatModal').classList.contains('hidden'))setTimeout(function(){if(voiceMode&&!rec&&!busy)listen()},400)}
function botSay(text){
  addMsg('bot',text);
  if(voiceMode||speakOn)speak(spoken(text),afterBot);else afterBot();
}
async function sendText(text){
  text=(text||'').trim();if(!text||busy)return;
  addMsg('user',text);
  var m=text.match(/^\s*(?:یادت\s*(?:باشه|بمونه)|به\s*یاد\s*داشته\s*باش)\s*(?:که|:)?\s*(.+)/);
  if(m){addMem(m[1]);botSay('باشه، یادم می‌مونه.');return}
  m=text.match(/^\s*فراموش\s*کن\s*(?:که|:)?\s*(.*)/);
  if(m){
    var q=m[1].trim();
    if(!q){botSay('چی رو فراموش کنم؟');return}
    var n=mem.length;mem=mem.filter(function(x){return x.indexOf(q)<0});lsSet('bm_mem',mem);
    botSay(mem.length<n?'باشه، فراموش کردم.':'همچین چیزی یادم نبود.');return;
  }
  busy=true;var wait=addMsg('bot','...',false);
  try{
    var a=await ask();wait.remove();busy=false;botSay(a);
    if(++turns%4===0)extractMem();
  }catch(e){
    busy=false;wait.textContent='⚠️ فعلاً نتونستم جواب بدم ('+e.message+'). نوع هوش مصنوعی و کلید یا آدرس رو توی ⚙️ تنظیمات چک کن.';
    afterBot();
  }
}

function openChat(mode){
  show('chatModal');voiceMode=(mode==='voice');
  $('chatTitle').textContent=(voiceMode?'🎤 چت صوتی با ':'💬 چت با ')+settings.botName;
  $('chatArea').innerHTML='';
  if(chat.length)chat.slice(-30).forEach(function(m){renderMsg(m.r,m.t)});
  else addMsg('bot','سلام '+settings.userName+'! من '+settings.botName+' هستم. هر چی تو دلته بگو.',false);
  $('spkBtn').textContent=speakOn?'🔊 صدا: روشن':'🔊 صدا: خاموش';
  if(voiceMode)listen();
}

function renderCal(){document.getElementById('monthTitle').textContent=monthsFa[viewDate.getMonth()]+' '+viewDate.getFullYear();var grid=document.getElementById('daysGrid');grid.innerHTML='';var y=viewDate.getFullYear(),m=viewDate.getMonth(),first=new Date(y,m,1).getDay(),offset=(first+1)%7,count=new Date(y,m+1,0).getDate(),today=new Date();for(var i=0;i<offset;i++){var e=document.createElement('div');e.className='day empty';grid.appendChild(e)}for(var d=1;d<=count;d++){var btn=document.createElement('button');btn.className='day';btn.textContent=d;var date=new Date(y,m,d),key=getKey(date);if(date.toDateString()===today.toDateString())btn.classList.add('today');if(tasks[key]&&tasks[key].length)btn.classList.add('has-tasks');(function(k){btn.onclick=function(){showDay(k)}})(key);grid.appendChild(btn)}}
function getKey(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}
function showDay(key){selectedDate=key;hide('calendarView');show('dayView');var p=key.split('-');document.getElementById('dayTitle').textContent='📜 '+p[2]+' '+monthsFa[+p[1]-1]+' '+p[0];renderTasks()}

function renderTasks(){var list=document.getElementById('taskList');list.innerHTML='';var arr=tasks[selectedDate]||[];if(!arr.length){var p=document.createElement('div');p.className='empty-day';p.textContent='هنوز کاری ثبت نشده...';list.appendChild(p);return}arr.forEach(function(task,i){var div=document.createElement('div');div.className='task'+(task.done?' done':'');var cb=document.createElement('input');cb.type='checkbox';cb.checked=task.done;cb.onchange=function(){tasks[selectedDate][i].done=cb.checked;saveTasks();renderTasks()};var span=document.createElement('span');span.textContent=task.text;var del=document.createElement('button');del.className='del';del.textContent='🗑';del.onclick=function(){tasks[selectedDate].splice(i,1);if(!tasks[selectedDate].length)delete tasks[selectedDate];saveTasks();renderTasks()};div.append(cb,span,del);list.appendChild(div)})}
function addTask(){var input=document.getElementById('newTask'),text=input.value.trim();if(!text||!selectedDate)return;if(!tasks[selectedDate])tasks[selectedDate]=[];tasks[selectedDate].push({text:text,done:false});saveTasks();input.value='';renderTasks()}

div id=\"bub\" hidden><\/div>\n<div id=\"menu\" hidden>\n<button data-m=\"1\">🌊 تاب‌خوردن<\/button>\n<button data-m=\"2\">👊 مشت به مشت<\/button>\n<button data-m=\"3\">🤖 ربات<\/button>\n<button data-m=\"4\">🌀 چرخش<\/button>\n<button data-m=\"5\">🕺 دیسکو<\/button>\n<button data-m=\"6\">🙌 موج دست<\/button>\n<button data-m=\"7\">🌪️ پروانه<\/button>\n<button data-m=\"8\">🐧 پنگوئنی<\/button>\n<button data-m=\"9\">⚡ لرزش<\/button>\n<button data-m=\"10\">🎉 پرش شاد<\/button>\n<button data-m=\"0\">⏹ بس کن<\/button>\n<\/div>\n<script>\nconst db=document.getElementById('dn'),mn=document.getElementById('menu');\n[db,mn,document.getElementById('pz'),document.getElementById('sh'),document.getElementById('tc'),document.getElementById('cp'),document.getElementById('ps')].forEach(el=>el.addEventListener('pointerdown',e=>e.stopPropagation()));\n\ndocument.getElementById('sh').addEventListener('click',()=>{shoot=true});\ndocument.getElementById('tc').addEventListener('click',()=>{tackleReq=true});\ndocument.getElementById('cp').addEventListener('click',()=>{chipReq=true});\ndocument.getElementById('ps').addEventListener('click',()=>{passReq=true});\ndocument.getElementById('pz').addEventListener('click',()=>{if(paused)return;paused=true;showBreak('بازی متوقف شد','','ادامه بازی',()=>{paused=false},true)});\ndb.addEventListener('click',()=>{mn.hidden=!mn.hidden});\nmn.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;dmode=+b.dataset.m;mn.hidden=true;db.classList.toggle('on',dmode>0);db.textContent='💃'});\n<\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script>\nconst R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(R.domElement);\nconst S=new THREE.Scene();S.background=new THREE.Color(0xbfe6e3);S.fog=new THREE.Fog(0xbfe6e3,70,200);\nconst C=new THREE.PerspectiveCamera(55,1,.1,320);\nfunction rs(){R.setSize(innerWidth,innerHeight);C.aspe   var k=dt*60,p=FB.p,r=FB.r,b=FB.b;
  if(FB.pause>0){FB.pause-=dt;return}
  FB.t-=dt;if(FB.t<=0){FB.t=0;fbEnd();return}
  /* بازیکن */
  if(FB.target){
    var dx=FB.target.x-p.x,dy=FB.target.y-p.y,d=Math.hypot(dx,dy);
    if(d>3){var sp=Math.min(4.4,d*.3);p.vx=dx/d*sp;p.vy=dy/d*sp}else{p.vx=p.vy=0}
  }else{p.vx*=.8;p.vy*=.8}
  /* ربات */
  var tx,ty,bl=Math.hypot(180-b.x,FB.H-b.y)||1,ux=(180-b.x)/bl,uy=(FB.H-b.y)/bl;
  if(b.y>FB.H*.7){tx=Math.max(145,Math.min(215,b.x));ty=FB.M+45}
  else if(b.y<r.y-6){tx=b.x+(b.x<180?-28:28);ty=b.y-34}
  else{tx=b.x-ux*22;ty=b.y-uy*22}
  var rx=tx-r.x,ry=ty-r.y,rd=Math.hypot(rx,ry);
  if(rd>2){var rs=Math.min(3.0,rd*.25);r.vx=rx/rd*rs;r.vy=ry/rd*rs}else{r.vx=r.vy=0}
  p.x+=p.vx*k;p.y+=p.vy*k;r.x+=r.vx*k;r.y+=r.vy*k;fbLimit(p);fbLimit(r);
  /* توپ */
  b.x+=b.vx*k;b.y+=b.vy*k;var fr=Math.pow(.985,k);b.vx*=fr;b.vy*=fr;
  fbKick(p);fbKick(r);
  if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.8}
  if(b.x>FB.W-b.r){b.x=FB.W-b.r;b.vx=-Math.abs(b.vx)*.8}
  var inGap=b.x>FB.GX0+b.r*.6&&b.x<FB.GX1-b.r*.6;
  if(b.y<FB.M+b.r&&!inGap){b.y=FB.M+b.r;b.vy=Math.abs(b.vy)*.8}
  if(b.y>FB.H-FB.M-b.r&&!inGap){b.y=FB.H-FB.M-b.r;b.vy=-Math.abs(b.vy)*.8}
  if(b.y<b.r*.5){fbGoal('p');return}
  if(b.y>FB.H-b.r*.5){fbGoal('r');return}
  if(b.y<4||b.y>FB.H-4){if(!inGap){b.vx=-b.vx}}
}
function fbDraw(){
  var W=FB.W,H=FB.H,M=FB.M,c=fx,i;
  for(i=0;i<9;i++){c.fillStyle=i%2?'#2e7d32':'#388e3c';c.fillRect(0,i*H/9,W,H/9+1)}
  c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=2;
  c.strokeRect(2,M,W-4,H-2*M);
  c.beginPath();c.moveTo(2,H/2);c.lineTo(W-2,H/2);c.stroke();
  c.beginPath();c.arc(W/2,H/2,42,0,7);c.stroke();
  c.strokeRect(100,M,160,60);c.strokeRect(100,H-M-60,160,60);
  c.fillStyle='rgba(0,0,0,.55)';c.fillRect(FB.GX0,0,FB.GX1-FB.GX0,M);c.fillRect(FB.GX0,H-M,FB.GX1-FB.GX0,M);
  c.fillStyle='#fff';c.fillRect(FB.GX0-3,0,3,M+2);c.fillRect(FB.GX1,0,3,M+2);c.fillRect(FB.GX0-3,H-M-2,3,M+2);c.fillRect(FB.GX1,H-M-2,3,M+2);
  var p=FB.p,r=FB.r,b=FB.b;
  c.fillStyle='rgba(0,0,0,.25)';[p,r,b].forEach(function(o){c.beginPath();c.ellipse(o.x+2,o.y+4,o.r,o.r*.6,0,0,7);c.fill()});
  c.fillStyle='#2f6bff';c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();c.stroke();
  c.fillStyle='#fff';c.beginPath();c.arc(p.x-5,p.y-3,2.5,0,7);c.arc(p.x+5,p.y-3,2.5,0,7);c.fill();
  c.fillStyle='#f4fbfa';c.strokeStyle='#19b5a5';c.beginPath();c.arc(r.x,r.y,r.r,0,7);c.fill();c.stroke();
  c.fillStyle='#17333a';c.beginPath();c.arc(r.x-5,r.y-2,2.5,0,7);c.arc(r.x+5,r.y-2,2.5,0,7);c.fill();
  c.fillStyle='#fff';c.strokeStyle='#222';c.lineWidth=2;c.beginPath();c.arc(b.x,b.y,b.r,0,7);c.fill();c.stroke();
  c.fillStyle='#222';c.beginPath();c.arc(b.x,b.y,3,0,7);c.fill();
  c.fillStyle='rgba(0,0,0,.45)';c.fillRect(W/2-34,H/2-11,68,22);
  c.fillStyle='#fff';c.font='bold 14px sans-serif';c.textAlign='center';c.textBaseline='middle';
  c.fillText('⏱ '+Math.ceil(FB.t),W/2,H/2);
  if(FB.pause>0&&!FB.end){c.fillStyle='rgba(0,0,0,.3)';c.fillRect(0,H/2-24,W,48);c.fillStyle='#fff';c.font='bold 18px sans-serif';c.fillText('آماده باش!',W/2,H/2+34)}
}
function fbLoop(now){
  if(!FB.running)return;
  var dt=Math.min(.033,(now-FB.last)/1000);FB.last=now;
  if(!FB.end)fbStep(dt);
  fbDraw();FB.raf=requestAnimationFrame(fbLoop);
}
document.getElementById('easyBtn').onclick=function(){startGame('easy')};document.getElementById('normalBtn').onclick=function(){startGame('normal')};document.getElementById('hardBtn').onclick=function(){startGame('hard')}
document.getElementById('restartBtn').onclick=function(){startGame(gameLevel)};document.getElementById('backLevelBtn').onclick=backToLevels;
function backToLevels(){hide('boardView');show('levelView');gameActive=false}
function startGame(level){gameLevel=level;gameActive=true;currentTurn='white';selected=null;capturedWhite=[];capturedBlack=[];board=makeBoard();hide('levelView');show('boardView');renderBoard();renderCaptured();updateTurn()}
function makeBoard(){var b=Array.from({length:8},function(){return Array(8).fill(null)});var back=['rook','knight','bishop','queen','king','bishop','knight','rook'];for(var c=0;c<8;c++){b[0][c]='black_'+back[c];b[1][c]='black_pawn';b[6][c]='white_pawn';b[7][c]='white_'+back[c]}return b}
function colorOf(p){return p?p.split('_')[0]:null}
function typeOf(p){return p?p.split('_')[1]:null}
function cloneBoard(bd){return bd.map(function(row){return row.slice()})}
function clearPathOn(bd,sr,sc,tr,tc){var r=sr+Math.sign(tr-sr),c=sc+Math.sign(tc-sc);while(r!==tr||c!==tc){if(bd[r][c])return false;r+=Math.sign(tr-sr);c+=Math.sign(tc-sc)}return true}
function legalMove(bd,sr,sc,tr,tc){var p=bd[sr][sc];if(!p)return false;var t=bd[tr][tc];var col=colorOf(p);if(t&&colorOf(t)===col)return false;var dr=tr-sr,dc=tc-sc,typ=typeOf(p);
  if(typ==='pawn'){var dir=col==='white'?-1:1,startRow=col==='white'?6:1;if(dc===0&&!t&&dr===dir)return true;if(dc===0&&!t&&sr===startRow&&dr===2*dir&&!bd[sr+dir][sc])return true;if(Math.abs(dc)===1&&dr===dir&&t)return true;return false}
  if(typ==='knight')return(Math.abs(dr)===2&&Math.abs(dc)===1)||(Math.abs(dr)===1&&Math.abs(dc)===2);
  if(typ==='king')return Math.max(Math.abs(dr),Math.abs(dc))===1;
  if(typ==='rook')return(dr===0||dc===0)&&clearPathOn(bd,sr,sc,tr,tc);
  if(typ==='bishop')return Math.abs(dr)===Math.abs(dc)&&clearPathOn(bd,sr,sc,tr,tc);
  if(typ==='queen')return((dr===0||dc===0)||Math.abs(dr)===Math.abs(dc))&&clearPathOn(bd,sr,sc,tr,tc);
  return false}
function movesFor(bd,color){var moves=[];for(var r=0;r<8;r++)for(var c=0;c<8;c++)if(bd[r][c]&&colorOf(bd[r][c])===color)for(var tr=0;tr<8;tr++)for(var tc=0;tc<8;tc++)if(legalMove(bd,r,c,tr,tc))moves.push({sr:r,sc:c,tr:tr,tc:tc});return moves}
function applyMoveSim(bd,m){var nb=cloneBoard(bd);nb[m.tr][m.tc]=nb[m.sr][m.sc];nb[m.sr][m.sc]=null;var p=nb[m.tr][m.tc];if(p&&typeOf(p)==='pawn'){if(colorOf(p)==='white'&&m.tr===0)nb[m.tr][m.tc]='white_queen';if(colorOf(p)==='black'&&m.tr===7)nb[m.tr][m.tc]='black_queen'}return nb}
function boardMaterial(bd,color){var s=0;for(var r=0;r<8;r++)for(var c=0;c<8;c++)if(bd[r][c]&&colorOf(bd[r][c])===color)s+=PVAL[typeOf(bd[r][c])];return s}
function kingInDanger(bd,color){var kr=-1,kc=-1;for(var r=0;r<8;r++)for(var c=0;c<8;c++)if(bd[r][c]===color+'_king'){kr=r;kc=c}if(kr<0)return false;var opp=color==='white'?'black':'white';return movesFor(bd,opp).some(function(m){return m.tr===kr&&m.tc===kc})}

function renderBoard(){var el=document.getElementById('chessBoard');el.innerHTML='';var targets=[];if(selected){for(var tr=0;tr<8;tr++)for(var tc=0;tc<8;tc++)if(legalMove(board,selected.r,selected.c,tr,tc))targets.push(tr+','+tc)}
  for(var r=0;r<8;r++)for(var c=0;c<8;c++){var cell=document.createElement('div');cell.className='chess-cell '+((r+c)%2?'dark':'light');if(selected&&selected.r===r&&selected.c===c)cell.classList.add('selected');if(targets.indexOf(r+','+c)>-1)cell.classList.add('move');var p=board[r][c];if(p)cell.textContent=PIECES[p];cell.onclick=(function(rr,cc){return function(){cellClick(rr,cc)}})(r,c);el.appendChild(cell)}}
function renderCaptured(){document.getElementById('capturedByBlack').textContent=capturedWhite.map(function(p){return PIECES[p]}).join(' ');document.getElementById('capturedByWhite').textContent=capturedBlack.map(function(p){return PIECES[p]}).join(' ')}
function updateTurn(){if(!gameActive){document.getElementById('turnInfo').textContent='بازی تمام شده';return}var danger=kingInDanger(board,currentTurn);var base=currentTurn==='white'?'نوبت تو ♙':'نوبت '+settings.botName+' ♟';document.getElementById('turnInfo').textContent=base+(danger?'   ⚠️ شاه در خطره!':'')}
function cellClick(r,c){if(!gameActive||currentTurn!=='white')return;var p=board[r][c];if(selected){if(legalMove(board,selected.r,selected.c,r,c)){movePiece(selected.r,selected.c,r,c);selected=null;renderBoard();renderCaptured();if(gameActive){currentTurn='black';updateTurn();setTimeout(botMove,350)}}else if(p&&colorOf(p)==='white'){selected={r:r,c:c};renderBoard()}else{selected=null;renderBoard()}}else if(p&&colorOf(p)==='white'){selected={r:r,c:c};renderBoard()}}
function movePiece(sr,sc,tr,tc){var target=board[tr][tc];var isKingCapture=target&&typeOf(target)==='king';if(target){if(colorOf(target)==='white')capturedWhite.push(target);else capturedBlack.push(target)}board[tr][tc]=board[sr][sc];board[sr][sc]=null;var p=board[tr][tc];if(p&&typeOf(p)==='pawn'){if(colorOf(p)==='white'&&tr===0)board[tr][tc]='white_queen';if(colorOf(p)==='black'&&tr===7)board[tr][tc]='black_queen'}if(isKingCapture){gameActive=false;var youWon=colorOf(target)==='black';setTimeout(function(){alert(youWon?'🎉 برنده شدی!':'🤖 '+settings.botName+' برنده شد!')},50)}}

function chooseBotMove(){var moves=movesFor(board,'black');if(!moves.length)return null;
  var winMoves=moves.filter(function(m){var t=board[m.tr][m.tc];return t&&typeOf(t)==='king'});if(winMoves.length)return winMoves[0];
  if(gameLevel==='easy'){var captures=moves.filter(function(m){return board[m.tr][m.tc]});var pool=(captures.length&&Math.random()<0.55)?captures:moves;return pool[Math.floor(Math.random()*pool.length)]}
  var scored=moves.map(function(m){var nb=applyMoveSim(board,m);var score=boardMaterial(nb,'black')-boardMaterial(nb,'white');if(gameLevel==='hard'){var replies=movesFor(nb,'white'),worst=0;replies.forEach(function(rp){var t=nb[rp.tr][rp.tc];if(t){var v=PVAL[typeOf(t)];if(v>worst)worst=v}});score-=worst*0.9}return{m:m,score:score}});
  scored.sort(function(a,b){return b.score-a.score});
  if(gameLevel==='hard')return scored[0].m;
  var topN=scored.slice(0,Math.min(3,scored.length));return topN[Math.floor(Math.random()*topN.length)].m}
function botMove(){if(!gameActive)return;var move=chooseBotMove();if(!move){gameActive=false;updateTurn();alert('🎉 تو برنده شدی!');return}movePiece(move.sr,move.sc,move.tr,move.tc);renderBoard();renderCaptured();if(gameActive){currentTurn='white';updateTurn()}}

function analyzeMood(){
  var symptoms=[];document.querySelectorAll('.symptom-item input:checked').forEach(function(x){symptoms.push(x.value)});

  var longDuration=duration==='week';

    html+='<p style="margin-top:10px">علائم انتخاب‌شده:</p><ul style="margin:6px 0 0 0;padding-right:18px;font-size:12.5px;line-height:1.9">';

    html+='</ul>';
  }

  if(hasUrgent){
    html+='<p style="margin-top:12px;color:#ff8a8a"><strong>⚠️ تنگی نفس علامتیه که نباید نادیده گرفته بشه.</strong> اگه شدید است یا بدتر می‌شه، همین الان با اورژانس (۱۱۵) یا نزدیک‌ترین مرکز درمانی تماس بگیر.</p>';
  } else if(longDuration || manySymptoms){
    html+='<p style="margin-top:12px;color:#ffd97f">این علائم بیشتر از چند روزه ادامه داره یا با هم زیادن؛ بهتره برای یه چکاپ به پزشک مراجعه کنی.</p>';
  } else if(symptoms.length){

  }
