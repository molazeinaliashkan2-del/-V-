<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نرمو؛ دستیار سلامتی</title>
<style>
:root{--bg:#eef7f6;--card:#fff;--ink:#17333a;--sub:#5b7a80;--acc:#19b5a5;--acc2:#ff6b6b;--bot:#dff3f0;--usr:#e8eefc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1f22;--card:#172c30;--ink:#e6f4f2;--sub:#8fb0b3;--bot:#1f3b3f;--usr:#26324f}}
:root[data-theme="dark"]{--bg:#0f1f22;--card:#172c30;--ink:#e6f4f2;--sub:#8fb0b3;--bot:#1f3b3f;--usr:#26324f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:460px;display:flex;flex-direction:column;padding:10px 14px;gap:8px;height:100%}
h1{font-size:18px;margin:0;text-align:center}
.status{text-align:center;color:var(--sub);font-size:13px;min-height:18px}
svg{width:100%;max-height:34vh;flex:none}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.mouth{transform-origin:center;transform-box:fill-box;transform:scaleY(.4)}
.talking .mouth{animation:talk .28s infinite alternate}
@keyframes talk{to{transform:scaleY(1.5)}}
.heart{animation:beat 1.2s infinite;transform-origin:center;transform-box:fill-box}
@keyframes beat{50%{transform:scale(1.25)}}
.listening .heart{fill:var(--acc2)}
.beam{opacity:0}
.scanning .beam{opacity:1;animation:sweep 1.3s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(0)}to{transform:translateY(150px)}}
.float{animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-5px)}}
#cam{position:relative;width:100%;height:32vh;border-radius:18px;overflow:hidden;border:3px solid var(--acc);flex:none;background:#000}
#cam[hidden]{display:none}
#vid{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cbeam{position:absolute;left:0;right:0;top:0;height:6px;background:var(--acc);box-shadow:0 0 18px 8px #19b5a588;opacity:0}
#cam.scanning .cbeam{opacity:1;animation:csweep 1.4s ease-in-out infinite alternate}
@keyframes csweep{to{top:calc(100% - 6px)}}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:80px}
.m{padding:8px 12px;border-radius:14px;max-width:85%;font-size:14px;line-height:1.7}
.m.bot{background:var(--bot);align-self:flex-start;border-top-right-radius:4px}
.m.usr{background:var(--usr);align-self:flex-end;border-top-left-radius:4px}
.scan{background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:8px 12px;font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.row{display:flex;gap:8px;align-items:center}
button{font:inherit;border:0;cursor:pointer;border-radius:999px}
#mic{width:64px;height:64px;background:var(--acc);color:#fff;font-size:26px;flex:none;box-shadow:0 4px 14px #19b5a566}
#mic.on{background:var(--acc2);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
#scanBtn{background:var(--card);color:var(--ink);border:2px solid var(--acc);padding:12px 16px;font-size:14px}
input{flex:1;min-width:0;border:1px solid var(--sub);background:var(--card);color:var(--ink);border-radius:999px;padding:12px 14px;font:inherit;font-size:14px}
.note{font-size:11px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="app">
<h1>نرمو 🤖 دستیار سلامتی</h1>
<svg id="bot" viewBox="0 0 200 230" aria-label="ربات نرمو">
 <g class="float">
  <line x1="100" y1="22" x2="100" y2="40" stroke="#9bd9d1" stroke-width="4"/>
  <circle cx="100" cy="18" r="7" fill="#19b5a5"/>
  <rect x="38" y="95" width="124" height="115" rx="55" fill="#f4fbfa" stroke="#9bd9d1" stroke-width="3"/>
  <ellipse cx="38" cy="140" rx="14" ry="26" fill="#f4fbfa" stroke="#9bd9d1" stroke-width="3"/>
  <ellipse cx="162" cy="140" rx="14" ry="26" fill="#f4fbfa" stroke="#9bd9d1" stroke-width="3"/>
  <ellipse cx="100" cy="75" rx="58" ry="44" fill="#f4fbfa" stroke="#9bd9d1" stroke-width="3"/>
  <ellipse class="eye" cx="76" cy="70" rx="9" ry="13" fill="#17333a"/>
  <ellipse class="eye" cx="124" cy="70" rx="9" ry="13" fill="#17333a"/>
  <circle cx="73" cy="64" r="3" fill="#fff"/><circle cx="121" cy="64" r="3" fill="#fff"/>
  <circle cx="58" cy="88" r="7" fill="#ffb3b3" opacity=".6"/><circle cx="142" cy="88" r="7" fill="#ffb3b3" opacity=".6"/>
  <ellipse class="mouth" cx="100" cy="90" rx="10" ry="6" fill="#17333a"/>
  <path class="heart" d="M100 168c-14-10-20-17-20-25a11 11 0 0 1 20-6a11 11 0 0 1 20 6c0 8-6 15-20 25z" fill="#19b5a5"/>
  <g class="beam"><rect x="20" y="40" width="160" height="6" rx="3" fill="#19b5a5" opacity=".85"/><rect x="20" y="40" width="160" height="22" fill="#19b5a5" opacity=".15"/></g>
 </g>
</svg>
<div id="cam" hidden><video id="vid" playsinline muted></video><div class="cbeam"></div></div>
<canvas id="cv" width="64" height="48" hidden></canvas>
<div class="status" id="status">آماده‌ام</div>
<div class="msgs" id="msgs"></div>
<div class="row">
 <button id="scanBtn">🔍 اسکن</button>
 <button id="mic" aria-label="میکروفون">🎤</button>
 <input id="txt" placeholder="یا اینجا بنویس…" enterkeyhint="send">
</div>
<div class="note">اسکن فقط سرگرمیه و ارزش پزشکی نداره.</div>
</div>
<script>
const $=id=>document.getElementById(id), bot=$('bot'), msgs=$('msgs');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, busy=false, talkTimer=null;
function setState(s,t){bot.classList.remove('talking','listening','scanning');if(s)bot.classList.add(s);$('status').textContent=t||'آماده‌ام';}
function add(cls,t){const d=document.createElement('div');d.className='m '+cls;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
let voices=[],ttsAudio=null,speakId=0,warned=false;
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){}}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
const faVoice=()=>voices.find(v=>/^fa/i.test(v.lang))||voices.find(v=>/persian|farsi|فارسی/i.test(v.name));
function stopSpeak(){speakId++;try{speechSynthesis.cancel()}catch(e){}if(ttsAudio){try{ttsAudio.pause()}catch(e){}ttsAudio=null}}
function chunks(t){
 const parts=t.match(/[^.!؟?،,]+[.!؟?،,]?/g)||[t],out=[];let cur='';
 for(const p of parts){if((cur+p).length>170&&cur){out.push(cur);cur=p}else cur+=p}
 if(cur.trim())out.push(cur);return out;
}
function speakText(t,done){
 const id=++speakId,v=faVoice();
 if(v){
  const u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang=v.lang;u.rate=.95;
  u.onend=u.onerror=()=>{if(id===speakId)done()};
  speechSynthesis.cancel();speechSynthesis.speak(u);return;
 }
 const ch=chunks(t);let i=0;
 const next=()=>{
  if(id!==speakId)return;
  if(i>=ch.length){done();return}
  const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=fa&q='+encodeURIComponent(ch[i++]));
  ttsAudio=a;a.onended=next;
  a.onerror=()=>{if(!warned){warned=true;add('bot','صدای فارسی روی این دستگاه نصب نیست و اینترنت هم جواب نداد. از تنظیمات گوشی، Text-to-speech رو باز کن و زبان فارسی رو دانلود کن.')}done()};
  a.play().catch(()=>done());
 };
 next();
}
function say(t){
 add('bot',t);
 setState('talking','نرمو داره حرف می‌زنه…');
 clearTimeout(talkTimer);
 const end=()=>{clearTimeout(talkTimer);if(!busy||!bot.classList.contains('scanning'))setState()};
 talkTimer=setTimeout(end,t.length*130+3000);
 try{speakText(t,end)}catch(e){end()}
}
const norm=s=>s.replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase();
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rules=[
 [/اسکن|بررسی|چکاپ|معاینه|scan/,()=>{scan()}],
 [/سلام|درود|hi|hello/,()=>pick(['سلام! من نرمو هستم. حالت چطوره؟','سلام دوست من! امروز چه کمکی از دستم برمیاد؟'])],
 [/سردرد|سر درد|سرم درد/,()=>'متاسفم که سرت درد می‌کنه. کمی آب بخور، چند دقیقه استراحت کن و چشمات رو از صفحه دور کن. اگه شدید بود یا ادامه پیدا کرد، حتما به پزشک مراجعه کن.'],
 [/درد|دل ?درد|ناراحتم/,()=>'شنیدن این برام ناراحت‌کننده‌ست. من پزشک نیستم، ولی اگه درد شدیده یا ادامه داره، لطفا با پزشک صحبت کن. بگو کجات درد می‌کنه؟'],
 [/غمگین|افسرده|تنهام|استرس|اضطراب|نگران/,()=>'من اینجام و گوش می‌دم. بیا یه نفس عمیق بکشیم. اگه این حس مدام باهاته، صحبت با یه آدم مورد اعتماد یا مشاور خیلی کمک می‌کنه.'],
 [/نفس/,()=>'باشه. چهار ثانیه دم، چهار ثانیه نگه دار، شش ثانیه بازدم. چند بار تکرار کن.'],
 [/حالت|چطوری|خوبی/,()=>'من عالیم، چون باتریم پره! تو چطوری؟'],
 [/اسمت|کی هستی|تو کی/,()=>'من نرمو هستم، یه ربات دوست‌داشتنی که مراقب سلامتی توئه.'],
 [/جوک|بخند|بامزه/,()=>pick(['چرا کامپیوتر سرما خورد؟ چون ویندوزش رو باز گذاشته بود!','به دکتر گفتم حافظه‌م ضعیفه. گفت از کی؟ گفتم از چی؟']) ],
 [/آب|تشنه/,()=>'آفرین که یادت افتاد! یه لیوان آب بخور.'],
 [/خواب|بی ?خواب|خسته/,()=>'بدنت استراحت لازم داره. امشب زودتر بخواب و قبل از خواب از گوشی فاصله بگیر.'],
 [/ممنون|مرسی|دمت/,()=>'خواهش می‌کنم! خوشحالم که کمکت کردم.'],
 [/خداحافظ|بای|خدانگهدار/,()=>'خداحافظ! مراقب خودت باش.'],
];
function reply(t){
 const n=norm(t);
 for(const [re,fn] of rules){if(re.test(n)){const r=fn();if(r)say(r);return}}
 say(pick(['متوجه نشدم. می‌تونی دوباره بگی؟','هنوز یاد نگرفتم این رو جواب بدم. بگو «اسکن» یا بپرس حالم چطوره.']));
}
let stream=null;
async function startCam(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
 const v=$('vid');v.srcObject=stream;await v.play();
 bot.style.display='none';$('cam').hidden=false;
}
function stopCam(){
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 $('cam').hidden=true;$('cam').classList.remove('scanning');bot.style.display='';
}
function sample(prev){
 const c=$('cv'),x=c.getContext('2d',{willReadFrequently:true});
 x.drawImage($('vid'),0,0,64,48);
 const d=x.getImageData(0,0,64,48).data,cur=new Uint8Array(3072);
 let b=0,m=0,s=0;
 for(let i=0,j=0;i<d.length;i+=4,j++){
  const r=d[i],g=d[i+1],bl=d[i+2],l=(r+g+bl)/3;
  b+=l;cur[j]=l;if(prev)m+=Math.abs(l-prev[j]);
  if(r>95&&g>40&&bl>20&&r>g&&r>bl&&r-Math.min(g,bl)>15)s++;
 }
 return{cur,b:b/3072,m:prev?m/3072:0,s:s/3072};
}
async function scan(){
 if(busy)return;busy=true;
 try{await startCam()}catch(e){
  say('به دوربین دسترسی ندارم (اجازه داده نشده یا این صفحه اجازه نمی‌ده). اسکن نمایشی رو انجام می‌دم.');
  return fakeScan();
 }
 say('دوربین روشن شد. به دوربین نگاه کن و چند ثانیه آروم بمون.');
 setState('scanning','در حال اسکن با دوربین…');
 await new Promise(r=>setTimeout(r,1500));
 $('cam').classList.add('scanning');
 let prev=null,B=0,M=0,S=0,n=0;
 for(let i=0;i<20;i++){
  await new Promise(r=>setTimeout(r,200));
  const f=sample(prev);prev=f.cur;B+=f.b;M+=f.m;S+=f.s;n++;
 }
 B/=n;M/=Math.max(1,n-1);S/=n;
 let face=S>0.1;
 try{if(window.FaceDetector){const fs=await new FaceDetector().detect($('vid'));face=fs.length>0}}catch(e){}
 stopCam();setState();busy=false;
 const light=B<50?'کم (نور بیشتر لازمه)':B>200?'خیلی زیاد':'مناسب';
 const calm=M<2?'خیلی آروم':M<6?'آروم':'پرحرکت';
 const c=document.createElement('div');c.className='scan';
 c.innerHTML=`<div>🙂 چهره: ${face?'پیدا شد':'پیدا نشد'}</div><div>💡 نور: ${light}</div><div>🧘 ثبات: ${calm}</div><div>🎨 پوست: ${Math.round(S*100)}٪ کادر</div><div style="grid-column:1/3;color:var(--sub)">این چهار مورد از تصویر زنده‌ی دوربین محاسبه شدن.</div>`;
 msgs.appendChild(c);msgs.scrollTop=msgs.scrollHeight;
 if(!face)say('چهره‌ای پیدا نکردم. نور رو بیشتر کن و صورتت رو وسط کادر بگیر، بعد دوباره اسکن کن.');
 else if(B<50)say('اسکن انجام شد، ولی نور کمه. برای نتیجه بهتر جای روشن‌تری برو.');
 else say(M<6?'اسکن تموم شد. چهره‌ات واضح بود و آروم بودی، عالیه! این فقط یه بازیه و جای پزشک رو نمی‌گیره.':'اسکن تموم شد. کمی تکون خوردی؛ دفعه‌ی بعد آروم‌تر بمون تا دقیق‌تر بشه.');
}
function fakeScan(){
 busy=true;
 say('باشه، اسکن شروع می‌شه. لطفا یه لحظه آروم بایست.');
 setTimeout(()=>{
  setState('scanning','در حال اسکن…');
  setTimeout(()=>{
   const hr=62+Math.floor(Math.random()*24),tp=(36.4+Math.random()*.5).toFixed(1),
   o2=96+Math.floor(Math.random()*4),st=pick(['کم','متوسط','کم']),
   mood=pick(['خوب','عالی','آروم']);
   const c=document.createElement('div');c.className='scan';
   c.innerHTML=`<div>❤️ ضربان: ${hr}</div><div>🌡️ دما: ${tp}</div><div>🫁 اکسیژن: ${o2}٪</div><div>🧠 استرس: ${st}</div><div style="grid-column:1/3">😊 حال کلی: ${mood}</div>`;
   msgs.appendChild(c);msgs.scrollTop=msgs.scrollHeight;
   setState();busy=false;
   say('اسکن تموم شد. همه‌چیز خوب به نظر می‌رسه! یادت باشه این فقط یه بازیه و جای پزشک رو نمی‌گیره.');
  },3800);
 },2600);
}
function send(t){t=t.trim();if(!t)return;add('usr',t);reply(t)}
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter'){send(e.target.value);e.target.value=''}});
$('scanBtn').onclick=()=>{add('usr','اسکن');scan()};
$('mic').onclick=()=>{
 if(!SR){say('مرورگرت تشخیص صدا رو پشتیبانی نمی‌کنه. لطفا از Chrome یا Safari استفاده کن یا تایپ کن.');return}
 if(rec){rec.stop();return}
 stopSpeak();
 rec=new SR();rec.lang='fa-IR';rec.interimResults=false;
 rec.onstart=()=>{$('mic').classList.add('on');setState('listening','دارم گوش می‌دم…')};
 rec.onresult=e=>send(e.results[0][0].transcript);
 rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')say('اجازه‌ی میکروفون داده نشده. می‌تونی تایپ کنی.')};
 rec.onend=()=>{$('mic').classList.remove('on');rec=null;if(!bot.classList.contains('talking')&&!bot.classList.contains('scanning'))setState()};
 rec.start();
};
add('bot','سلام! من نرمو هستم. یه جای صفحه رو لمس کن تا صدام رو بشنوی.');
let greeted=false;
document.addEventListener('pointerdown',e=>{
 if(greeted)return;greeted=true;
 if(!e.target.closest('button,input'))say('سلام! من نرمو هستم. دکمه‌ی میکروفون رو بزن و باهام حرف بزن، یا بگو اسکن.');
});
</script>
</body>
</html>
